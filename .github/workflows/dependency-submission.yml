name: Dependency Submission

on:
  push:
    branches: [main]
    paths:
      - go.mod
      - go.sum
      - vendor/**
      - .github/workflows/dependency-submission.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dependency-submission-${{ github.ref }}
  cancel-in-progress: true

jobs:
  submit:
    name: Submit Go dependency graph
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: 1.26.5
          cache: true
      - uses: actions/go-dependency-submission@5b7d83fc0451f125096d30e1bf1deed84eedfa06 # main (2026-07-13, node24)
        with:
          go-mod-path: go.mod
